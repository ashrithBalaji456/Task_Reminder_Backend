version: '3.8'

services:
  # PostgreSQL Database Container
  db:
    image: postgres:17-alpine
    container_name: task_reminder_postgres
    restart: always
    environment:
      POSTGRES_DB: task_reminder_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_reminder_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Spring Boot Backend Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_reminder_backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/task_reminder_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: 1234
      SPRING_PROFILES_ACTIVE: prod
      BREVO_API_KEY: ${BREVO_API_KEY:}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-ashrithbalajigudla@gmail.com}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BEl62iUYgUivxIkv69yViEuiBIa-Ib9-Skv69yViEuiBIa-Ib9-S}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
